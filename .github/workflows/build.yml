name: KolibriX firmware build

on:
  push:
    branches: [kolibrix-cardputer-adv]
  pull_request:
    branches: [kolibrix-cardputer-adv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build KolibriX firmware
        run: pio run -e kolibrix

      - name: Build SD launcher
        run: pio run -e launcher

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: kolibrix-cardputer-firmware
          path: |
            .pio/build/kolibrix/firmware.bin
            .pio/build/launcher/firmware.bin
