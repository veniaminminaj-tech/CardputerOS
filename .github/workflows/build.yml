name: KolibriX firmware build

on:
  push:
    branches: [kolibrix-cardputer-adv]
  pull_request:
    branches: [kolibrix-cardputer-adv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [kolibrix, launcher]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Verify firmware binary
        shell: bash
        run: |
          test -s ".pio/build/${{ matrix.environment }}/firmware.bin"
          stat -c "Firmware size: %s bytes" ".pio/build/${{ matrix.environment }}/firmware.bin"

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: kolibrix-${{ matrix.environment }}-firmware
          path: .pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
