; CardputerOS: Launcher (стартове меню) + застосунки на SD
[platformio]
default_envs = launcher

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_cardputer.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
    -DARDUINO_LOOP_STACK_SIZE=32768
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
build_unflags =
    -std=gnu++11
lib_deps =
    m5stack/M5Cardputer @ ^1.0.2
    bitbank2/AnimatedGIF @ ^2.2.0
    https://github.com/lieff/minimp3.git
lib_ldf_mode = deep+

; Launcher: фабричний розділ. Прошивається по USB один раз:
;   pio run -e launcher -t upload
[env:launcher]
build_src_filter = +<launcher/>

; KolibriX: збирається в .pio/build/kolibrix/firmware.bin
; Скопіюйте цей файл на SD як /boot/kolibrix.bin
[env:kolibrix]
build_src_filter = +<*> -<launcher/>
